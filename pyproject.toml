[project]
name = "AgentTrainer"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets==4.8.5",
  "pillow==11.1.0",
  "torch",
  "pydantic>=2.13.3",
  "openai>=2.0.0",
  "platformdirs==4.3.6",
  "tenacity==9.0.0",
  "diskcache==5.6.3",
  "python-dotenv==1.0.1",
  "wikipedia==1.4.0",
  "numpy>=2.0.0,<3",
  "google-genai",
  "openrlhf[vllm]==0.10.2",
  "pylatexenc>=2.10",
]

[tool.uv]
environments = [
  "sys_platform == 'linux' and python_full_version >= '3.12' and python_full_version < '3.13'",
]
concurrent-builds = 8
concurrent-installs = 8
concurrent-downloads = 8

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

